name: CD - Deploy backend

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Install Docker CLI
        run: |
          apt-get update
          apt-get install -y docker.io

      - name: Run Linting Checks (Checkstyle, PMD, SpotBugs)
        run: ./mvnw checkstyle:check pmd:check spotbugs:check

      - name: Build and replace backend
        run: |
          docker build -t infra-backend:latest .
          docker inspect backend --format '{{range .Config.Env}}{{println .}}{{end}}' > backend.env
          docker rm -f backend || true
          docker run -d --name backend --restart unless-stopped --network infra_infra_net -p 8081:8080 --env-file backend.env infra-backend:latest

      - name: Verify backend health
        run: |
          for i in $(seq 1 20); do
            docker run --rm --network infra_infra_net curlimages/curl:8.10.1 -fsS http://backend:8080/actuator/health && exit 0
            sleep 3
          done
          docker logs backend
          exit 1

      - name: Record deployment success
        if: success()
        run: docker exec postgres psql -U admin -d gestproj -c "INSERT INTO deployments (project_id, status, commit_hash, commit_message, triggered_by, started_at, finished_at) VALUES (1, 'SUCCESS', '${{ github.sha }}', 'Backend deployed by Gitea Actions', '${{ github.actor }}', NOW(), NOW());"

      - name: Record deployment failure
        if: failure()
        run: docker exec postgres psql -U admin -d gestproj -c "INSERT INTO deployments (project_id, status, commit_hash, commit_message, triggered_by, started_at, finished_at) VALUES (1, 'FAILURE', '${{ github.sha }}', 'Backend deployment failed in Gitea Actions', '${{ github.actor }}', NOW(), NOW());"
